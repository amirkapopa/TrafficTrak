[project]
name = "traffictrak"
version = "1.0.0"
description = "Offline traffic-event detection and causal accident-risk estimation for a fixed CCTV camera"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

[tool.ruff]
line-length = 140
target-version = "py310"
extend-exclude = ["outputs", "weights"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
"scripts/calibrate_geometry.py" = ["E501"]  # embedded single-file HTML/JS tool
