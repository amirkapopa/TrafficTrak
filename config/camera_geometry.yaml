# =============================================================================
# TrafficTrak - fixed-camera scene geometry for the WIUT Hackathon 2026 camera
# (4K view of a signal-controlled intersection on a divided avenue, Tashkent).
#
# CALIBRATED from the organisers' sample clip C3905 (3840x2160, 29.97 fps); the
# camera is fixed (feature registration across the clip: 0 px shift, 0 deg
# rotation, scale 1.000), so this geometry holds for every video it records.
#   * crossings  - measured on the painted zebras (outline grown by ~10 px @1080p)
#   * sidewalks  - pedestrian refuge islands (3 pink triangles, median tip)
#   * carriageway - derived from where the 191 tracked vehicles of the sample
#                   actually drove (config/scene_prior.npz), eroded ~10 px off
#                   the kerbs: conservative, it only covers road that is driven
# Not calibrated (left empty on purpose, rules stay silent rather than guess):
#   stop lines / signal phases (red_light, stop_line), lanes, solid lines,
#   prohibited turns.  Review with:
#   python scripts/calibrate_geometry.py render --image docs/assets/camera_reference.jpg
#
# COORDINATES are normalised: x = px / width, y = px / height (origin top-left).
# Schema and field documentation: see the comments in git history of this file
# or README.md "Calibrating the scene".
# =============================================================================
